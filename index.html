
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scanner Check-In DN8</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      background: #f5f7fb;
      color: #1f2937;
    }
    h2 { margin: 0 0 12px; font-size: 20px; }
    #reader {
      width: 100%;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #d1d5db;
      min-height: 220px;
    }
    .btn-cam {
      width: 100%;
      margin-top: 10px;
      background: #059669;
    }
    .cam-box { margin-top: 10px; display: none; }
    select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      font-size: 14px;
    }
    .manual-box { margin-top: 12px; display: flex; gap: 8px; }
    input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
    }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    .result {
      margin-top: 14px;
      padding: 14px;
      border-radius: 10px;
      display: none;
      line-height: 1.5;
      word-break: break-word;
    }
    .ok { display: block; background: #dcfce7; border: 1px solid #86efac; color: #14532d; }
    .warn { display: block; background: #fef9c3; border: 1px solid #fde047; color: #713f12; }
    .err { display: block; background: #fee2e2; border: 1px solid #fca5a5; color: #7f1d1d; }
  </style>
</head>
<body>
  <h2>Scan QR Check-In Peserta</h2>
  <div id="reader"></div>

  <button id="btnStartCam" class="btn-cam" onclick="inisiasiKamera()">Aktifkan Kamera</button>

  <div id="camBox" class="cam-box">
    <select id="cameraSelect"></select>
  </div>

  <div class="manual-box">
    <input id="manualCode" type="text" placeholder="Input manual kode tiket jika perlu..." onkeydown="if(event.key==='Enter') submitManual()" />
    <button id="btnManual" onclick="submitManual()">Cek</button>
  </div>

  <div id="resultBox" class="result"></div>

  <script>
    const WEB_APP_URL = "TEMPEL_URL_WEB_APP_ANDA_DI_SINI";

    let isProcessing = false;
    let lastScanned = "";
    let lastScanAt = 0;
    let isScanning = false;

    const html5QrCode = new Html5Qrcode("reader");
    const camBox = document.getElementById("camBox");
    const cameraSelect = document.getElementById("cameraSelect");
    const btnStartCam = document.getElementById("btnStartCam");

    function showResult(type, title, sub = "") {
      const box = document.getElementById("resultBox");
      box.className = "result " + type;
      box.innerHTML = `<b>${title}</b>${sub ? "<br/>" + sub : ""}`;
    }

    function prosesKode(kode) {
      const clean = (kode || "").trim();
      if (!clean || isProcessing) return;

      const now = Date.now();
      if (clean === lastScanned && now - lastScanAt < 3000) return;

      lastScanned = clean;
      lastScanAt = now;
      isProcessing = true;
      document.getElementById("btnManual").disabled = true;
      showResult("warn", "Memverifikasi kode...", clean);

      fetch(`${WEB_APP_URL}?kode=${encodeURIComponent(clean)}`, {
        method: "GET",
        redirect: "follow"
      })
        .then((r) => r.json())
        .then((res) => {
          isProcessing = false;
          document.getElementById("btnManual").disabled = false;
          if (res && res.ok) {
            showResult("ok", res.message, `${res.detail || ""}<br/>Waktu: ${res.waktu || ""}`);
            document.getElementById("manualCode").value = "";
          } else if (res && res.duplicate) {
            showResult("warn", res.message, res.waktu ? `Waktu awal: ${res.waktu}` : "");
          } else {
            showResult("err", (res && res.message) || "Kode tidak valid.");
          }
        })
        .catch((err) => {
          isProcessing = false;
          document.getElementById("btnManual").disabled = false;
          showResult("err", "Gagal terhubung ke server", err.message || String(err));
        });
    }

    function submitManual() {
      prosesKode(document.getElementById("manualCode").value);
    }

    function startWithConfig(cameraConfig) {
      const config = { fps: 10, qrbox: { width: 220, height: 220 } };
      const onSuccess = (decodedText) => prosesKode(decodedText);
      const onError = () => {};

      const runStart = () => html5QrCode.start(cameraConfig, config, onSuccess, onError);
      const promise = isScanning ? html5QrCode.stop().then(runStart) : runStart();

      promise
        .then(() => {
          isScanning = true;
          btnStartCam.style.display = "none";
          muatDaftarKamera();
        })
        .catch((err) => {
          showResult(
            "err",
            "Gagal menyalakan kamera",
            "Pastikan dibuka via HTTPS (misal GitHub Pages/Vercel) & izinkan akses kamera.<br/>Detail: " + ((err && err.message) || String(err))
          );
        });
    }

    function inisiasiKamera() {
      startWithConfig({ facingMode: "environment" });
    }

    function muatDaftarKamera() {
      Html5Qrcode.getCameras()
        .then((devices) => {
          if (devices && devices.length > 1) {
            camBox.style.display = "block";
            cameraSelect.innerHTML = devices
              .map((d, idx) => `<option value="${d.id}">${d.label || "Kamera " + (idx + 1)}</option>`)
              .join("");
            cameraSelect.onchange = () => startWithConfig(cameraSelect.value);
          }
        })
        .catch(() => {});
    }
  </script>
</body>
</html>
